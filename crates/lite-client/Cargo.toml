[package]
name = "lite-client"
description = "A client of outcast-lite's wire for a native remote: the connection, the events, the segment's shape and the PCM decoded to 16-bit or float"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The WebSocket, pure Rust, the client side of the handshake; no TLS, since the lite
# speaks plain ws:// behind a manager.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
