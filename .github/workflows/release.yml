name: release

# A tag builds the release: the check and the cross builds in Glass's builder image, the
# components fetched from their releases and verified, the plugin zip, then one job that
# signs it (MANIFEST inside, SHA256SUMS beside) and publishes it as a pre-release with the
# notes from the changelog. Run by hand it builds everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs, plugin
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the workspace is $version" >&2; exit 1; }
          grep -q "\"version\": \"$version\"" plugin/package.json || { echo "plugin/package.json does not carry $version" >&2; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: false
      - run: scripts/check.sh

  shell:
    name: shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning -s sh plugin/install.sh plugin/uninstall.sh
      - run: shellcheck -S warning scripts/*.sh

  android:
    # The client crate a remote links, and its reference client, built for the three
    # Android ABIs the way Glass builds its app: the Android Rust targets, the NDK and
    # cargo-ndk on the runner itself. Nothing of it is a release asset; a remote takes
    # the crate from this repository by tag.
    name: lite-client for Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: lite-client and its reference client for arm64-v8a, armeabi-v7a and x86_64
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -name '27.*' | sort -V | tail -n1)
          export ANDROID_NDK_HOME="$ndk"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release --locked -p lite-client --examples
          for abi in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            f="target/$abi/release/examples/lite-client"
            [ -f "$f" ] || { echo "no reference client for $abi" >&2; exit 1; }
            file "$f" | grep -q ELF || { echo "$f is not an ELF" >&2; exit 1; }
          done
      - run: scripts/package-client.sh android
      - uses: actions/upload-artifact@v7
        with:
          name: release-client-android
          path: dist/outcast-lite-client-*-android.tar.gz
          if-no-files-found: error

  windows:
    # The lite's reference client for Windows remotes, cross-built with MinGW-w64 in the
    # builder image, the way Glass builds its Windows display.
    name: lite-client for Windows
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false
          save-if: false
      - run: scripts/ship-client-windows.sh
      - run: scripts/package-client.sh windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: release-client-windows
          path: dist/outcast-lite-client-*-windows-*.tar.gz
          if-no-files-found: error

  ship:
    name: cross builds, the components, the plugin zip
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: false
      - run: scripts/ship.sh
      - name: evotap and evopeg from their releases, verified against the evo release key
        run: scripts/fetch-components.sh
        env:
          # For the API's asset endpoint, the way round GitHub's download addresses when they fail.
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/outcast-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: The zip carries the core, the tap and the encoder for every architecture, and the modules
        run: |
          for arch in arm armv7 armv8 x64; do
            for f in bin/$arch/outcast bin/$arch/evopeg bin/$arch/evotap-cat lib/$arch/libevotap.so; do
              unzip -l dist/outcast-*.zip | grep -q " $f\$" || { echo "no $f in the zip" >&2; exit 1; }
            done
          done
          for module in kew v-conf; do
            unzip -l dist/outcast-*.zip | grep -q " node_modules/$module/package.json\$" || { echo "no module $module in the zip" >&2; exit 1; }
          done
      - run: scripts/package-lite.sh
      - run: scripts/package-client.sh linux-x64 linux-armv7 linux-armv8
      - name: The lite component for every architecture, and the x64 one runs and says its version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for arch in arm armv7 armv8 x64; do
            t="dist/outcast-lite-$version-$arch.tar.gz"
            [ -f "$t" ] || { echo "no $t" >&2; exit 1; }
            for f in bin/outcast-lite README.md LICENSE examples/lite-client.rs; do
              tar -tzf "$t" | grep -q "^outcast-lite-$version-$arch/$f\$" || { echo "no $f in $t" >&2; exit 1; }
            done
          done
          tar -xzf "dist/outcast-lite-$version-x64.tar.gz" -C "$RUNNER_TEMP"
          said=$("$RUNNER_TEMP/outcast-lite-$version-x64/bin/outcast-lite" --version)
          [ "$said" = "outcast-lite $version" ] || { echo "the lite says '$said'" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: release-plugin
          path: dist/outcast-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-lite
          path: dist/outcast-lite-[0-9]*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-client-linux
          path: dist/outcast-lite-client-*-linux-*.tar.gz
          if-no-files-found: error

  publish:
    name: sign, publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, shell, ship, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-plugin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-lite
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-client-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-client-windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-client-android
          path: dist
      # The zip and every lite archive carry MANIFEST, every file's digest, and its
      # Ed25519 signature; beside them SHA256SUMS and its signature. The private key comes from the repository's
      # secret RELEASE_SIGNING_KEY (the evo release key as PEM); the public key the plugin
      # carries (keys/release-signing.pub) checks every signature before anything is
      # published. A release is never published unsigned.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - name: Notes from the changelog, with the components and the sponsorship footer
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            printf '\nShips evotap %s and evopeg %s.\n\n' "$(sed -n 's/^VERSION=//p' components/evotap.lock)" "$(sed -n 's/^VERSION=//p' components/evopeg.lock)"
            printf 'Beside the zip, outcast-lite %s for Glass and any other consumer, one archive per architecture, and the lite client for every remote platform (Linux x64, armv7 and armv8, Windows x64, Android) with the crate a remote links; all signed the same way; docs/outcast-lite.md says what it is and how it is used.\n\n' "$version"
            cat .github/release-footer.md
          } > dist/notes.md
      # Published as a pre-release: no player is offered it but one asked for it by
      # version. It is made the latest by hand once it has been tried
      # (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --prerelease \
            dist/outcast-*.zip dist/outcast-lite-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig
