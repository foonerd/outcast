name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The check and the builds run in Glass's builder image (scripts/builder/Dockerfile in
# foonerd/glass, named here by its digest): the cross compilers and Node are in it, and
# a job installs no system package while it runs. Build caches are written from main
# only and read by the release. The shell lint runs on the bare runner, which has
# shellcheck.
jobs:
  check:
    name: format, lints, tests, docs, plugin
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml, in the image unless the file has moved on
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh

  shell:
    name: shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning -s sh plugin/install.sh plugin/uninstall.sh
      - run: shellcheck -S warning scripts/*.sh

  android:
    # The client crate a remote links, and its reference client, built for the three
    # Android ABIs the way Glass builds its app: the Android Rust targets, the NDK and
    # cargo-ndk on the runner itself. Nothing of it is a release asset; a remote takes
    # the crate from this repository by tag.
    name: lite-client for Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: lite-client and its reference client for arm64-v8a, armeabi-v7a and x86_64
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -name '27.*' | sort -V | tail -n1)
          export ANDROID_NDK_HOME="$ndk"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release --locked -p lite-client --examples
          for abi in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            f="target/$abi/release/examples/lite-client"
            [ -f "$f" ] || { echo "no reference client for $abi" >&2; exit 1; }
            file "$f" | grep -q ELF || { echo "$f is not an ELF" >&2; exit 1; }
          done
      - run: scripts/package-client.sh android
      - uses: actions/upload-artifact@v7
        with:
          name: outcast-lite-client-android
          path: dist/outcast-lite-client-*-android.tar.gz
          if-no-files-found: error

  windows:
    # The lite's reference client for Windows remotes, cross-built with MinGW-w64 in the
    # builder image, the way Glass builds its Windows display.
    name: lite-client for Windows
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ship-client-windows.sh
      - run: scripts/package-client.sh windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: outcast-lite-client-windows
          path: dist/outcast-lite-client-*-windows-*.tar.gz
          if-no-files-found: error

  ship:
    name: cross builds, the components, the plugin zip
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ship.sh
      - name: evotap and evopeg from their releases, verified against the evo release key
        run: scripts/fetch-components.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/outcast-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: The zip carries the core, the tap and the encoder for each build, no arm copy, no modules, and stays under the store's limit
        run: |
          for arch in armv7 armv8 x64; do
            for f in bin/$arch/outcast bin/$arch/evopeg bin/$arch/evotap-cat lib/$arch/libevotap.so; do
              unzip -l dist/outcast-*.zip | grep -q " $f\$" || { echo "no $f in the zip" >&2; exit 1; }
            done
          done
          # The universal Raspberry Pi image (arm) takes the armv7 files at install; a copy here
          # would put the zip over the plugin store's 17 MB.
          if unzip -l dist/outcast-*.zip | grep -q " bin/arm/"; then echo "the zip carries an arm copy" >&2; exit 1; fi
          size=$(stat -c %s dist/outcast-*.zip)
          [ "$size" -lt 17000000 ] || { echo "the zip is $size bytes, over the store's limit" >&2; exit 1; }
          echo "the zip is $size bytes"
          # The plugin store wants the node modules made on the player at install, which install.sh
          # does from the lock file in the zip: none travel in it.
          if unzip -l dist/outcast-*.zip | grep -q " node_modules/"; then echo "the zip carries node_modules" >&2; exit 1; fi
          unzip -l dist/outcast-*.zip | grep -q " package-lock.json$" || { echo "no package-lock.json in the zip" >&2; exit 1; }
      - name: The modules install from the zip's lock file the way install.sh installs them on a player
        run: |
          d=$(mktemp -d)
          unzip -q dist/outcast-*.zip -d "$d"
          ( cd "$d" && npm install --omit=dev --no-audit --no-fund --loglevel=error --fetch-retries=3 )
          for module in kew v-conf; do
            [ -f "$d/node_modules/$module/package.json" ] || { echo "no module $module after the install" >&2; exit 1; }
          done
          echo "the modules installed from the lock file: $(find "$d/node_modules" -mindepth 1 -maxdepth 1 -type d | wc -l)"
      - run: scripts/package-lite.sh
      - run: scripts/package-client.sh linux-x64 linux-armv7 linux-armv8
      - name: The lite component for every architecture, and the x64 one runs and says its version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for arch in arm armv7 armv8 x64; do
            t="dist/outcast-lite-$version-$arch.tar.gz"
            [ -f "$t" ] || { echo "no $t" >&2; exit 1; }
            for f in bin/outcast-lite README.md LICENSE examples/lite-client.rs; do
              tar -tzf "$t" | grep -q "^outcast-lite-$version-$arch/$f\$" || { echo "no $f in $t" >&2; exit 1; }
            done
          done
          tar -xzf "dist/outcast-lite-$version-x64.tar.gz" -C "$RUNNER_TEMP"
          said=$("$RUNNER_TEMP/outcast-lite-$version-x64/bin/outcast-lite" --version)
          [ "$said" = "outcast-lite $version" ] || { echo "the lite says '$said'" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: outcast-plugin
          path: dist/outcast-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: outcast-lite
          path: dist/outcast-lite-[0-9]*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: outcast-lite-client-linux
          path: dist/outcast-lite-client-*-linux-*.tar.gz
          if-no-files-found: error
