[package]
name = "outcast"
description = "The core of Outcast Uplink: follows the player's audio ring and carries the sound to every uplink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The audio ring's reader and the sample layouts, from the Glass release that
# built the evotap the plugin ships (components/evotap.lock).
# The tap at Glass v0.11.10 or later, evotap 0.1.1: the ring is the contract, versioned by
# evotap, so the pin follows Glass's main and the lock names the revision built against.
tap = { git = "https://github.com/foonerd/glass", branch = "main" }
# The segment, the feed and the conformer, shared with outcast-lite.
stream = { path = "../../crates/stream" }
libc = "0.2"
# The SRT transport: the protocol's state machines, pure Rust, driven over UDP here.
srt-protocol = "0.4.4"
# The RTMP session: the handshake, the chunk stream and the commands, pure Rust.
rml_rtmp = "0.8.0"
# TLS for rtmps://, pure Rust with ring's cryptography; the public roots are Mozilla's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# SHA-256 and HMAC for the S3 signature, the same ring rustls uses.
ring = "0.17"
bytes = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
