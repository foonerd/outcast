<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcast Uplink</title>
<style>
  :root {
    --bg: #1c1c1c; --panel: #262626; --panel2: #303030; --line: #404040;
    --text: #e6e6e6; --muted: #9a9a9a; --accent: #54b948; --accent2: #3f8f37;
    --warn: #e6a23c; --danger: #d64545; --info: #4a90e2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 6px; transition: background .15s, border-color .15s; }
  button:hover { background: #3a3a3a; border-color: #555; }
  button.small { padding: 5px 10px; font-size: 13px; }
  .hidden { display: none !important; }
  .header { position: sticky; top: 0; z-index: 20; background: #232323; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .header h1 { font-size: 19px; font-weight: 600; color: #fff; white-space: nowrap; }
  .header .sub { color: var(--muted); font-size: 13px; }
  .header .grow { flex: 1; min-width: 0; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card .title { background: var(--panel2); color: #fff; font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .card .title .help { font-weight: 400; }
  .card .body { padding: 10px 14px 14px; }
  .wide { grid-column: 1 / -1; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 7px 8px; border-bottom: 1px solid #333; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
  table.kv tr:last-child td { border-bottom: 0; }
  table.kv td:first-child { color: var(--muted); width: 38%; }
  .help { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px; padding: 2px 8px; border-radius: 10px; background: #3a3a3a; color: #bbb; text-transform: uppercase; vertical-align: middle; }
  .badge.green { background: var(--accent); color: #fff; }
  .badge.orange { background: var(--warn); color: #222; }
  .badge.red { background: var(--danger); color: #fff; }
  .badge.blue { background: var(--info); color: #fff; }
  .meter { display: grid; grid-template-columns: 2.2em 1fr 7em; gap: 10px; align-items: center; font-size: 13px; margin: 6px 0; }
  .meter .lab { color: var(--muted); font-weight: 600; }
  .bar { height: 12px; background: #111; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative; }
  .bar .rms { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent2) 0%, var(--accent) 70%, var(--warn) 88%, var(--danger) 100%); }
  .bar .peak { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .9; }
  .bar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 6 - 1px), rgba(255,255,255,.08) calc(100% / 6 - 1px), rgba(255,255,255,.08) calc(100% / 6)); pointer-events: none; }
  .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
  .uplink { display: grid; grid-template-columns: minmax(160px, 1.1fr) 7em minmax(200px, 2fr) minmax(220px, 2fr); gap: 10px 14px; align-items: start; padding: 10px 8px; border-bottom: 1px solid #333; }
  .uplink:last-child { border-bottom: 0; }
  .uplink .name { font-weight: 600; color: #fff; }
  .uplink .name .help { display: block; font-weight: 400; margin-top: 2px; }
  .uplink .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .uplink .detail .t { color: var(--text); display: block; margin-top: 2px; }
  .uplink .counters { font-size: 13px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .uplink .counters b { color: var(--text); font-weight: 600; }
  .uplink .err { color: #ffb3b3; font-size: 13px; margin-top: 4px; grid-column: 1 / -1; }
  @media (max-width: 720px) { .uplink { grid-template-columns: 1fr 7em; } .uplink .detail, .uplink .counters { grid-column: 1 / -1; } }
  .bar .rms.warm { background: var(--warn); } .bar .rms.hot { background: var(--danger); }
  .smeter { display: grid; grid-template-columns: 4.6em 1fr 4.2em; gap: 4px 10px; align-items: center; font-size: 13px; margin: 6px 0; }
  .smeter .lab { color: var(--muted); font-weight: 600; }
  .smeter .sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; margin-top: -2px; }
  .srow { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; font-size: 13px; margin: 8px 0 0; align-items: baseline; }
  .srow .lab { color: var(--muted); font-weight: 600; }
  .srow b { color: var(--text); font-weight: 600; }
  .dead { color: var(--danger); font-weight: 600; }
  .warn { color: var(--warn); }
  .empty { color: var(--muted); padding: 20px 8px; }
  .foot { margin-top: 14px; color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="header">
  <h1>Outcast Uplink</h1>
  <span class="sub grow" id="core">connecting…</span>
  <button class="small hidden" id="close">Close</button>
</div>
<div class="container">
  <div class="grid">
    <section class="card">
      <div class="title">Programme <span class="help" id="deadair-badge"></span></div>
      <div class="body">
        <table class="kv">
          <tr><td>Playing</td><td id="playing">—</td></tr>
          <tr><td>Title</td><td id="title">—</td></tr>
          <tr><td>Stream</td><td id="stream">—</td></tr>
          <tr><td>Dead air</td><td id="deadair">—</td></tr>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="title">Level <span class="help">RMS and peak, dBFS, from the tap's meter</span></div>
      <div class="body" id="meters"></div>
    </section>
    <section class="card">
      <div class="title">Player <span class="help">the machine, every second</span></div>
      <div class="body" id="player"><div class="empty">no reading yet</div></div>
    </section>
    <section class="card wide">
      <div class="title">Uplinks <span class="help" id="count"></span></div>
      <div class="body" id="uplinks"><div class="empty">none set up</div></div>
    </section>
  </div>
  <div class="foot"><span id="foot"></span><span>Every second, from the core's own status.</span></div>
</div>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mb = (b) => (b / 1048576).toFixed(b > 104857600 ? 0 : 1) + ' MB';
  const ago = (epoch, now) => {
    const s = Math.max(0, now - epoch);
    if (s < 60) return s + ' s';
    if (s < 3600) return Math.floor(s / 60) + ' min';
    if (s < 86400) return Math.floor(s / 3600) + ' h ' + Math.floor((s % 3600) / 60) + ' min';
    return Math.floor(s / 86400) + ' d ' + Math.floor((s % 86400) / 3600) + ' h';
  };
  const kinds = { icecast: 'Icecast', lan: 'Network stream', record: 'Recording', srt: 'SRT', rtmp: 'RTMP', ts: 'Transport stream', hls: 'HLS' };
  const badge = (state) => {
    const cls = /^(connected|streaming|recording|listening)$/.test(state) ? 'green' : /^(waiting|connecting|starting)$/.test(state) ? 'orange' : state === 'error' ? 'red' : '';
    return '<span class="badge ' + cls + '">' + esc(state) + '</span>';
  };
  const host = location.hostname;
  const link = (u) => {
    const m = /^port (\d+)/.exec(u.detail || '');
    if (u.kind === 'lan' && m) return ' · <a href="http://' + host + ':' + m[1] + '/" target="_blank" rel="noopener">listen</a>';
    if (u.kind === 'hls' && m) return ' · <a href="http://' + host + ':' + m[1] + '/" target="_blank" rel="noopener">playlist</a>';
    return '';
  };
  const meter = (label, rms, peak) => {
    const pct = (db) => Math.max(0, Math.min(100, (db + 60) / 60 * 100));
    return '<div class="meter"><span class="lab">' + label + '</span><div class="bar"><div class="rms" style="width:' + pct(rms).toFixed(1) + '%"></div><div class="ticks"></div><div class="peak" style="left:' + pct(peak).toFixed(1) + '%"></div></div><span class="num">' + rms.toFixed(1) + ' / ' + peak.toFixed(1) + '</span></div>';
  };
  const sysMeter = (label, pct, num, sub, cls) => '<div class="smeter"><span class="lab">' + label + '</span><div class="bar"><div class="rms ' + (cls || '') + '" style="width:' + Math.max(0, Math.min(100, pct)).toFixed(1) + '%"></div><div class="ticks"></div></div><span class="num">' + num + '</span><span class="sub">' + sub + '</span></div>';
  function renderSystem(y) {
    const p = $('player');
    if (!y) { p.innerHTML = '<div class="empty">no reading yet</div>'; return; }
    const rows = [];
    rows.push(sysMeter('CPU', y.cpu_pct, y.cpu_pct.toFixed(0) + ' %', 'the whole player, ' + y.cores + (y.cores === 1 ? ' core' : ' cores') + '; load ' + y.load1.toFixed(2) + ' · ' + y.load5.toFixed(2) + ' · ' + y.load15.toFixed(2)));
    rows.push(sysMeter('Outcast', y.outcast_cpu_pct, y.outcast_cpu_pct.toFixed(1) + ' %', 'the core and its encoders; encoders ' + y.encoders_cpu_pct.toFixed(1) + ' %'));
    const memPct = y.mem_total_mb ? 100 * y.mem_used_mb / y.mem_total_mb : 0;
    rows.push(sysMeter('Memory', memPct, memPct.toFixed(0) + ' %', (y.mem_used_mb / 1024).toFixed(1) + ' of ' + (y.mem_total_mb / 1024).toFixed(1) + ' GB used; Outcast ' + y.outcast_rss_mb + ' MB'));
    if (y.temp_c != null) rows.push(sysMeter('Temp', y.temp_c, y.temp_c.toFixed(0) + ' °C', y.temp_c >= 80 ? 'hot: the processor throttles, or is about to' : y.temp_c >= 70 ? 'warm' : 'the processor', y.temp_c >= 80 ? 'hot' : y.temp_c >= 70 ? 'warm' : ''));
    rows.push('<div class="srow"><span class="lab">Out</span><span>uplinks <b>' + y.uplinks_kbps.toFixed(0) + ' kbit/s</b>' + (y.net_iface ? ' <span class="help">· the player ' + y.net_tx_kbps.toFixed(0) + ' kbit/s on ' + esc(y.net_iface) + '</span>' : '') + '</span></div>');
    p.innerHTML = rows.join('');
  }
  let failures = 0;
  function render(s) {
    const now = Math.floor(Date.now() / 1000);
    $('core').textContent = 'core ' + s.version + ' · ' + s.tag + ' · up ' + ago(s.started, now) + (s.last_error ? ' · ' + s.last_error : '');
    $('core').className = 'sub grow' + (s.last_error ? ' warn' : '');
    if (s.ring) {
      $('playing').textContent = s.ring.rate + ' Hz, ' + s.ring.channels + ' ch, ' + s.ring.format + (s.ring.one_bit ? ' (DSD)' : '');
      $('stream').textContent = s.segments + ' segments, ' + mb(s.bytes) + (s.lost ? ', ' + s.lost + ' bytes lost' : '') + (s.ring.healed ? ', healed ' + s.ring.healed : '');
    } else {
      $('playing').textContent = 'nothing: the player is silent';
      $('stream').textContent = s.segments + ' segments so far, ' + mb(s.bytes);
    }
    $('title').textContent = s.title || '—';
    $('deadair').innerHTML = s.dead_air ? '<span class="dead">yes, ' + s.quiet_seconds + ' s</span>' : (s.quiet_seconds ? 'no (quiet ' + s.quiet_seconds + ' s)' : 'no');
    $('deadair-badge').innerHTML = s.dead_air ? '<span class="badge red">dead air</span>' : (s.ring ? '<span class="badge green">on air</span>' : '<span class="badge">silent</span>');
    const m = $('meters');
    if (s.level && s.level.rms_db && s.level.rms_db.length) {
      m.innerHTML = s.level.rms_db.map((rms, i) => meter(i === 0 ? 'L' : i === 1 ? 'R' : String(i + 1), rms, s.level.peak_db[i] == null ? rms : s.level.peak_db[i])).join('') + '<div class="help">−60 to 0 dBFS; the white line is the peak.</div>';
    } else {
      m.innerHTML = '<div class="empty">no level: the tap is not measuring</div>';
    }
    renderSystem(s.system);
    const u = $('uplinks');
    if (!s.uplinks || !s.uplinks.length) { u.innerHTML = '<div class="empty">none set up</div>'; $('count').textContent = ''; return; }
    const up = s.uplinks.filter((x) => /^(connected|streaming|recording|listening)$/.test(x.state)).length;
    $('count').textContent = up + ' of ' + s.uplinks.length + ' up';
    u.innerHTML = s.uplinks.map((x) => {
      const slot = /^icecast(\d+)$/.exec(x.id);
      const name = (kinds[x.kind] || x.id) + (slot ? ' ' + slot[1] : '');
      const c = [];
      c.push('<b>' + mb(x.bytes || 0) + '</b>');
      c.push('since <b>' + ago(x.since, now) + '</b>');
      if (x.reconnects) c.push('reconnects <b>' + x.reconnects + '</b>');
      if (x.kind === 'hls') { if (x.segments) c.push('segments <b>' + x.segments + '</b>'); if (x.pending) c.push('waiting for the origin <b>' + x.pending + '</b>'); if (x.listeners) c.push('connections <b>' + x.listeners + '</b>'); if (x.dropped) c.push('refused <b>' + x.dropped + '</b>'); }
      else if (x.dropped) c.push('dropped <b>' + x.dropped + '</b>');
      if (x.kind === 'lan') c.push('listening <b>' + (x.listeners || 0) + '</b>');
      if (x.kind === 'record' && x.files) c.push('files <b>' + x.files + '</b>');
      if (x.kind === 'srt' && x.state === 'connected') c.push('round trip <b>' + x.rtt_ms + ' ms</b>, lost <b>' + x.lost_packets + '</b>');
      if (x.cpu_pct) c.push('cpu <b>' + x.cpu_pct.toFixed(1) + ' %</b>');
      if (x.silence) c.push('<span class="warn">silence</span>');
      return '<div class="uplink">'
        + '<div class="name">' + esc(name) + '<span class="help">' + esc(x.id) + '</span></div>'
        + '<div>' + badge(x.state) + '</div>'
        + '<div class="detail">' + esc(x.detail) + link(x) + (x.title ? '<span class="t">' + esc(x.title) + '</span>' : '') + '</div>'
        + '<div class="counters">' + c.map((x) => '<span>' + x + '</span>').join('') + '</div>'
        + (x.last_error && (x.state === 'error' || x.state === 'waiting' || x.state === 'connecting') ? '<div class="err">' + esc(x.last_error) + '</div>' : '')
        + '</div>';
    }).join('');
  }
  function tick() {
    fetch('/status.json', { cache: 'no-store' }).then((r) => r.json()).then((s) => {
      failures = 0; render(s);
      $('foot').textContent = 'updated ' + new Date().toLocaleTimeString();
    }).catch(() => {
      failures += 1;
      if (failures > 2) { $('core').innerHTML = '<span class="warn">the core does not answer</span>'; }
    });
  }
  // Close: only when this page is the window itself. Inside Volumio's own iframe page
  // its arrow back is the way out. The window closes where the browser allows (one the
  // UI opened), else the page steps back, else it goes to the player's own page.
  if (window.parent === window) {
    $('close').classList.remove('hidden');
    $('close').onclick = function () {
      window.close();
      setTimeout(function () {
        if (window.closed) return;
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'http://' + host + '/';
      }, 100);
    };
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
