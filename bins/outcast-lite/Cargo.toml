[package]
name = "outcast-lite"
description = "The player's sound as it is, over a WebSocket, for a page or a remote: the tap's ring read, no encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The audio ring's reader, from the Glass release that built the evotap the players
# carry (components/evotap.lock).
tap = { git = "https://github.com/foonerd/glass", tag = "v0.11.10" }
# The segment, the feed and the conformer, shared with the core.
stream = { path = "../../crates/stream" }
# The WebSocket, pure Rust, the server side of the handshake only.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[lints]
workspace = true
